<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>附表附件總覽｜健保給付規範快速查詢系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <div class="bg-white/10 p-2 rounded-lg shrink-0">
                    <i data-lucide="paperclip" class="w-8 h-8 text-blue-200"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">附表附件總覽</h1>
                    <p class="text-xs sm:text-sm text-blue-100 mt-0.5">健保給付規範快速查詢系統｜共收錄 <span id="att-count">--</span> 份附表</p>
                </div>
            </div>
            <a href="./index.html" class="text-xs text-blue-100 hover:text-white transition-colors flex items-center gap-1 font-medium bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full border border-white/10 shadow-sm shrink-0">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>回主查詢系統</span>
            </a>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-1 w-full">

        <!-- Filter -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-5">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="h-5 w-5 text-slate-400"></i>
                </span>
                <input type="text" id="filter-input" placeholder="搜尋附表編號或名稱關鍵字…" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm placeholder-slate-400" />
            </div>
        </div>

        <!-- Table listing -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wide">
                    <tr>
                        <th class="text-left px-4 py-3 font-bold w-28">編號</th>
                        <th class="text-left px-4 py-3 font-bold">附表名稱</th>
                        <th class="text-left px-4 py-3 font-bold w-20">頁數</th>
                        <th class="px-4 py-3 w-16"></th>
                    </tr>
                </thead>
                <tbody id="att-table-body" class="divide-y divide-slate-100">
                    <!-- JS populates -->
                </tbody>
            </table>
            <div id="empty-state" class="hidden text-center py-10 text-slate-400 text-sm">
                找不到符合的附表，試試其他關鍵字。
            </div>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="viewer-backdrop" class="fixed inset-0 bg-slate-900/70 z-[60] hidden items-center justify-center p-3 sm:p-6" role="dialog" aria-modal="true">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 shrink-0">
                <h3 id="viewer-title" class="font-bold text-slate-800 text-sm sm:text-base pr-4"></h3>
                <button id="viewer-close" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-4 sm:p-6 bg-slate-100 flex-1 flex flex-col items-center gap-4">
                <!-- JS injects <img> tags -->
            </div>
            <div class="px-5 py-3 border-t border-slate-200 bg-white text-xs text-slate-400 flex items-center gap-1.5 shrink-0">
                <i data-lucide="info" class="w-3.5 h-3.5"></i>
                <span>圖片為原始給付規定文件掃描頁面示意圖，若需正式引用請以健保署官方公告文件為準。</span>
            </div>
        </div>
    </div>

    const IMAGE_BASE = 'attachments_images/';

    function safeCreateIcons() {
        try {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        } catch (e) {
            console.warn('圖示庫(lucide)載入失敗，圖示不會顯示，但不影響其他功能：', e);
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById('att-table-body');
        const emptyState = document.getElementById('empty-state');
        tbody.innerHTML = '';
        if (list.length === 0) {
            emptyState.classList.remove('hidden');
            return;
        }
        emptyState.classList.add('hidden');
        list.forEach(att => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-blue-50/60 cursor-pointer transition-colors';
            tr.dataset.label = att.label;
            tr.innerHTML = `
                <td class="px-4 py-3 font-mono text-blue-700 font-bold whitespace-nowrap">${att.label}</td>
                <td class="px-4 py-3 text-slate-700">${att.title}</td>
                <td class="px-4 py-3 text-slate-400">${att.images.length} 頁</td>
                <td class="px-4 py-3 text-right">
                    <i data-lucide="image" class="w-4 h-4 text-slate-400 inline-block"></i>
                </td>
            `;
            tr.addEventListener('click', () => openViewer(att.label));
            tbody.appendChild(tr);
        });
        safeCreateIcons();
    }

    function openViewer(label) {
        const att = ATTACHMENTS.find(a => a.label === label);
        if (!att) return;
        document.getElementById('viewer-title').textContent = `${att.label}　${att.title}`;
        const body = document.querySelector('#viewer-backdrop .overflow-y-auto');
        body.innerHTML = att.images.map(fn =>
            `<img src="${IMAGE_BASE}${fn}" class="max-w-full rounded-lg border border-slate-300 shadow-sm" alt="${att.label}" loading="lazy" />`
        ).join('');
        document.getElementById('viewer-backdrop').classList.remove('hidden');
        document.getElementById('viewer-backdrop').classList.add('flex');
        history.replaceState(null, '', '#' + encodeURIComponent(label));
    }

    function closeViewer() {
        document.getElementById('viewer-backdrop').classList.add('hidden');
        document.getElementById('viewer-backdrop').classList.remove('flex');
        history.replaceState(null, '', location.pathname + location.search);
    }

    document.getElementById('viewer-close').addEventListener('click', closeViewer);
    document.getElementById('viewer-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'viewer-backdrop') closeViewer();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeViewer();
    });

    document.getElementById('filter-input').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        const filtered = !q ? ATTACHMENTS : ATTACHMENTS.filter(a =>
            a.label.toLowerCase().includes(q) || a.title.toLowerCase().includes(q)
        );
        renderTable(filtered);
    });

    // 初始化
    document.getElementById('att-count').textContent = ATTACHMENTS.length;
    renderTable(ATTACHMENTS);
    safeCreateIcons();

    // 支援從主系統的 [ATTACH:附表一] 連結直接跳轉並開啟對應附件： attachments.html#附表一
    if (location.hash) {
        const label = decodeURIComponent(location.hash.slice(1));
        if (ATTACHMENTS.some(a => a.label === label)) {
            openViewer(label);
        }
    }
</script>
</body>
</html>
